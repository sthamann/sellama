[package]
name = "veyndo-automation"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Independent Veyndo Commerce rule registry, validation and deterministic evaluation"
[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
veyndo-kernel = { path = "../kernel" }
